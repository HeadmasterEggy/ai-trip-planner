[project]
name = "ai-trip-planner"
version = "0.1.0"
description = "Multi-agent trip planner: five LangChain specialists negotiating under a LangGraph orchestrator, with a Streamlit UI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.2,<2",
    "langchain-openai>=1.1,<2",
    "langgraph>=1.0,<2",
    "pydantic>=2.9,<3",
    "python-dotenv>=1.0,<2",
    "httpx>=0.27,<1",
    "streamlit>=1.49,<2",
    "langsmith>=0.4,<1",
]

[dependency-groups]
dev = ["pytest>=8.4,<10", "ruff>=0.12,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trip_planner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    # Tests that call a real provider. Skipped unless RUN_LIVE_TESTS=1 and a key is
    # set, so the default run stays offline; see tests/test_live_provider.py.
    "live: calls a real model provider (opt-in)",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Implicit concatenation is how long prompt and detail strings stay readable
# here; every occurrence is deliberate, so the "did you forget a comma" guard
# would only produce noise.
ignore = ["ISC003"]
