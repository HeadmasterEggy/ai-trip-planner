[theme]
# Dark, because the app is a workspace you leave open next to a conversation and
# a bright page next to a dark one is the first thing that looks wrong. Streamlit
# owns every widget colour from here; our own components read `ui.theme.PALETTE`,
# which repeats these values on purpose and is pinned to them by
# `tests/test_theme.py` -- a palette in two files drifts silently otherwise.
base = "dark"
primaryColor = "#8B8CF7"
backgroundColor = "#0D0D10"
secondaryBackgroundColor = "#17171C"
textColor = "#ECECF1"
borderColor = "#2A2A33"
linkColor = "#8B8CF7"
codeBackgroundColor = "#17171C"
baseRadius = "0.5rem"
buttonRadius = "0.5rem"
showSidebarBorder = true
font = "sans serif"

[server]
headless = true
